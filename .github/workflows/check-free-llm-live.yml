# Manual only. Sends one real request to each routable free LLM provider and
# prints what came back, so the endpoints in free-llm-gateway can be confirmed
# against live responses instead of staying transcribed-but-unverified.
#
# Nothing runs on push: this reaches third-party hosts, so it fires only when
# someone clicks "Run workflow".

name: Check free LLM providers (live)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: free-llm-gateway
        run: npm install

      - name: Offline test suite
        working-directory: free-llm-gateway
        run: npm test

      - name: Live provider check
        working-directory: free-llm-gateway
        # Add only the keys you actually have, under Settings > Secrets and
        # variables > Actions. A secret that does not exist expands to an empty
        # string, which getApiKey() reads as absent: that provider stays
        # inactive and check:live lists it as pending rather than failing it.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
        run: npm run check:live
